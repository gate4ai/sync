# nfpm package spec for the Ubuntu/Debian .deb — built in CI
# (.github/workflows/release.yml) from the linux/amd64 binary.
#
# Installing this package does not launch the app or register autostart —
# it only places the binary and a menu entry. The app registers its own
# autostart entry (internal/autostart, an XDG .desktop file under
# ~/.config/autostart) the first time it actually runs, best-effort, with
# no settings toggle to turn it off. So the first run has to be by hand:
# from the app menu or `gate4ai-sync` in a terminal.
name: gate4ai-sync
arch: amd64
platform: linux
version: ${VERSION}
maintainer: gate4.ai <support@gate4.ai>
description: File sync client for the gate4.ai server (tray app).
homepage: https://github.com/gate4ai/server
license: MIT
contents:
  - src: ./dist/gate4ai-sync-linux-amd64
    dst: /usr/bin/gate4ai-sync
    file_info:
      mode: 0755
  - src: ./packaging/nfpm/gate4ai-sync.desktop
    dst: /usr/share/applications/gate4ai-sync.desktop
  - src: ./internal/trayapp/icon.png
    dst: /usr/share/icons/hicolor/32x32/apps/gate4ai-sync.png
