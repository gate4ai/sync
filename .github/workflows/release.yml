# Action versions checked directly at source (each action's GitHub Releases
# page) on 17.09.2026, same as ci.yml's own note about its versions.
#
# Every push to main is a release: no manual tag, no changelog step — the
# version is a plain patch auto-increment over the highest existing v*
# tag. If that ever needs to be a minor/major bump instead, push the tag
# by hand before merging and this workflow will build on top of it.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - name: go mod tidy is a no-op
        run: |
          go mod tidy -diff || {
            echo "go.mod/go.sum are not tidy; run 'go mod tidy'"; exit 1;
          }
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: CGO_ENABLED=0 go test ./...

  # Bumps the patch component of the highest existing vX.Y.Z tag (v0.1.0 if
  # there is none yet) and pushes the new tag. This is the only place the
  # release version is decided — every later job reads it from here.
  version:
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: bump
        run: |
          latest="$(git tag --list 'v*' | sort -V | tail -n1)"
          if [ -z "$latest" ]; then
            new="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            new="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$new" >> "$GITHUB_OUTPUT"
          echo "version=${new#v}" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$new"
          git push origin "$new"

  package-linux:
    needs: [version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -o dist/gate4ai-sync-linux-amd64 ./cmd/gate4ai-sync
      - name: install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: build .deb
        run: |
          nfpm package --config packaging/nfpm/nfpm.yaml --packager deb --target "dist/gate4ai-sync-${VERSION}-amd64.deb"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-amd64
          path: |
            dist/gate4ai-sync-linux-amd64
            dist/*.deb
          if-no-files-found: error

  package-windows:
    needs: [version]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build binary
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir dist
          go build -o dist/gate4ai-sync-windows-amd64.exe ./cmd/gate4ai-sync
        shell: bash
      - name: build .ico from tray icon
        run: magick internal\trayapp\icon.png -define icon:auto-resize=256,64,48,32,16 packaging\windows\icon.ico
        shell: cmd
      - name: install WiX
        run: dotnet tool install --global wix
      - name: build .msi
        run: |
          wix build packaging\windows\product.wxs -d Version=$env:VERSION -o "dist\gate4ai-sync-$env:VERSION-amd64.msi"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-amd64
          path: |
            dist/gate4ai-sync-windows-amd64.exe
            dist/*.msi
          if-no-files-found: error

  package-macos:
    needs: [version]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build universal binary
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 go build -o dist/gate4ai-sync-darwin-amd64 ./cmd/gate4ai-sync
          GOOS=darwin GOARCH=arm64 go build -o dist/gate4ai-sync-darwin-arm64 ./cmd/gate4ai-sync
          lipo -create -output dist/gate4ai-sync-darwin-universal dist/gate4ai-sync-darwin-amd64 dist/gate4ai-sync-darwin-arm64
      - name: build .app bundle
        run: |
          app="dist/gate4.ai sync.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp dist/gate4ai-sync-darwin-universal "$app/Contents/MacOS/gate4ai-sync"
          chmod +x "$app/Contents/MacOS/gate4ai-sync"
          sed "s/__VERSION__/$VERSION/" packaging/macos/Info.plist.template > "$app/Contents/Info.plist"

          iconset=dist/icon.iconset
          mkdir -p "$iconset"
          for size in 16 32 64 128 256 512; do
            sips -z "$size" "$size" internal/trayapp/icon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/icon.icns"
      - name: build .dmg
        run: |
          dmg="dist/gate4ai-sync-${VERSION}-universal.dmg"
          hdiutil create -volname "gate4.ai sync" -srcfolder "dist/gate4.ai sync.app" -ov -format UDZO "$dmg"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-universal
          path: |
            dist/gate4ai-sync-darwin-amd64
            dist/gate4ai-sync-darwin-arm64
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: [version, package-linux, package-windows, package-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
